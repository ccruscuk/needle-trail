<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Needle Trail Support</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--ln:#e2e2e6;--ac:#0a64d8}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--mut:#9a9aa3;--ln:#2c2c31;--ac:#6cb0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:42rem;margin:0 auto;padding:1.5rem 1.1rem 3rem}
h1{font-size:1.6rem;margin:.2rem 0 1rem}h2{font-size:1.1rem;margin:1.8rem 0 .4rem}
p{margin:.5rem 0}ul{padding-left:1.2rem}li{margin:.25rem 0}
a{color:var(--ac)}.mut{color:var(--mut)}footer{margin-top:2.5rem;border-top:1px solid var(--ln);padding-top:1rem;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Needle Trail</h1>
<p>Needle Trail is a puzzle game for iPhone. Draw one unbroken thread through every square, stop at each number in order and stitch a small pattern. A calm puzzle with no ads, no purchases and no timers.</p>
<h2>Support</h2>
<p>Questions or feedback: <a href="mailto:info@beemap.io">info@beemap.io</a></p>
<p><a href="privacy.html">Privacy Policy</a></p>
<footer class="mut">BeeGame</footer>
</main>
</body>
</html>
